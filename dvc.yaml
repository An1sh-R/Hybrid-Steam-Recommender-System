# DVC pipeline. `uv run dvc repro` re-runs only the stages whose deps changed.
# One stage per step; later stages (co-occurrence, content, ranker, eval) get added below.

stages:
  prepare:
    cmd: uv run python -m steam_rec.prepare
    deps:
      - data/raw
      - data/external
      - src/steam_rec/data.py
      - src/steam_rec/prepare.py
    outs:
      - data/processed

  split:
    cmd: uv run python -m steam_rec.split
    deps:
      - data/processed/reviews.parquet
      - src/steam_rec/split.py
    outs:
      - data/split

  cooccurrence:
    cmd: uv run python -m steam_rec.cooccurrence
    deps:
      - data/processed/reviews.parquet
      - src/steam_rec/split.py
      - src/steam_rec/cooccurrence.py
    outs:
      - data/cooccurrence

  content:
    cmd: uv run python -m steam_rec.content
    deps:
      - data/processed/catalog.parquet
      - src/steam_rec/content.py
    outs:
      - data/content

  evaluate:
    cmd: uv run python -m steam_rec.evaluate
    deps:
      - data/processed/reviews.parquet
      - data/processed/catalog.parquet
      - data/split
      - data/cooccurrence
      - data/content
      - src/steam_rec/candidates.py
      - src/steam_rec/evaluate.py
    metrics:
      - metrics/retrieval_val.json:
          cache: false

  ranker:
    cmd: uv run python -m steam_rec.ranker
    deps:
      - data/processed/reviews.parquet
      - data/processed/catalog.parquet
      - data/split
      - data/cooccurrence
      - data/content
      - src/steam_rec/candidates.py
      - src/steam_rec/evaluate.py
      - src/steam_rec/ranker.py
    outs:
      - models/ranker.txt
      - data/ranker/val_eval_ranked.parquet
    metrics:
      - metrics/ranker_val.json:
          cache: false

  rerank:
    cmd: uv run python -m steam_rec.rerank
    deps:
      - data/processed/reviews.parquet
      - data/processed/catalog.parquet
      - data/split/val_targets.parquet
      - data/ranker/val_eval_ranked.parquet
      - src/steam_rec/content.py
      - src/steam_rec/evaluate.py
      - src/steam_rec/rerank.py
    metrics:
      - metrics/rerank_val.json:
          cache: false
